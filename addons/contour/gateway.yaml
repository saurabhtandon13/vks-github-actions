apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contour-gateway
  namespace: tanzu-system-ingress
spec:
  gatewayClassName: contour-gatewayclass
  listeners:
    # 🔓 HTTP listener
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    # 🔐 HTTPS listener (per-HTTPRoute certs)
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All

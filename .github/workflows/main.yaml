name: VKS Cluster Create

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  preparing-environment:           # name of the job
    runs-on: arc-runner-vks        # Runer location
    env:
      SUPERVISOR_IP: "192.168.80.6"
      VCF_CLI_VSPHERE_USERNAME: "administrator@vsphere.local"
      VCF_CLI_VSPHERE_PASSWORD: ${{ secrets.VCF_CLI_VSPHERE_PASSWORD }} 
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install VCF CLI
        run: |
          curl -LO "https://packages.broadcom.com/artifactory/vcf-distro/vcf-cli/linux/amd64/v9.0.1/vcf-cli.tar.gz"
          tar -xvf vcf-cli.tar.gz
          sudo mv vcf-cli-linux_amd64 /usr/local/bin/vcf

      - name: Creating the VCF Context 
        run: |
          vcf context create supervisor-login --endpoint ${SUPERVISOR_IP} --insecure-skip-tls-verify --username ${VCF_CLI_VSPHERE_USERNAME}
          vcf context use supervisor-login
      
      - name: Install kubectl CLI 
        run: |
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Creating the Cluster
        run: |
          kubectl apply -f clustercreate.yaml 

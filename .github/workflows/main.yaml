name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: arc-runner-vks
    env:
      VCF_CLI_VSPHERE_PASSWORD: ${{ secrets.VCF_CLI_VSPHERE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl CLI 
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install VCF CLI
        run: |
          curl -LO "https://packages.broadcom.com/artifactory/vcf-distro/vcf-cli/linux/amd64/v9.0.1/vcf-cli.tar.gz"
          tar -xvf vcf-cli.tar.gz
          sudo mv vcf-cli-linux_amd64 /usr/local/bin/vcf
    
      - name: Creating the VCF Context 
        run: |
          vcf context create supervisor-login --endpoint 192.168.80.6 --insecure-skip-tls-verify --username administrator@vsphere.local
           vcf context use supervisor-login
   
      - name: Getting the Node Status
        run: |
          kubectl get nodes 

      - name: Creating the Cluster
        run: |
          pwd
          ls -lart
          kubectl apply -f clustercreate.yaml 
